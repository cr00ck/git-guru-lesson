plugins {
    id 'java-library'
    id 'io.qameta.allure' version "2.11.2"
}

group = 'org.example'
version = '1.0-SNAPSHOT'

allure {
    version = "2.24.0"

    adapter {
        autoconfigure.set(true)

        frameworks {
            junit5 {
                adapterVersion.set("2.24.0")
                enabled.set(true)
                autoconfigureListeners.set(true)
            }
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

def aspectjWeaverVersion = "1.9.22"
def selenideVersion = "6.13.0"
def restAssuredVersion = "5.3.0"
def allureVersion = "2.24.0"
def junitVersion = "5.9.3"
def slf4jVersion = "2.0.7"

dependencies {
    testImplementation "io.qameta.allure:allure-junit5:${allureVersion}"
    testImplementation "io.qameta.allure:allure-selenide:${allureVersion}"

    testImplementation 'io.github.bonigarcia:webdrivermanager:5.6.3'
    testImplementation 'net.datafaker:datafaker:2.5.2'
    testImplementation 'com.codeborne:selenide:7.15.1'
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.slf4j:slf4j-simple:${slf4jVersion}"
    testImplementation 'commons-io:commons-io:2.16.1'
    testImplementation 'com.codeborne:pdf-test:1.8.1'
    testImplementation 'com.codeborne:xls-test:1.4.3'
    testImplementation 'com.opencsv:opencsv:5.12.0'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'net.javacrumbs.json-unit:json-unit-assertj:3.2.2'
    testImplementation 'io.appium:java-client:10.0.0'
    testImplementation 'org.aeonbits.owner:owner:1.0.12'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"
    testImplementation "io.rest-assured:json-path:${restAssuredVersion}"
    testImplementation "io.rest-assured:xml-path:${restAssuredVersion}"
    testImplementation "io.rest-assured:json-schema-validator:${restAssuredVersion}"
    testImplementation "io.qameta.allure:allure-rest-assured:${allureVersion}"

    testImplementation 'javax.xml.bind:jaxb-api:2.3.1'
    testImplementation 'com.sun.xml.bind:jaxb-impl:2.3.3'
    testImplementation 'com.sun.xml.bind:jaxb-core:2.3.0.1'
    testImplementation 'javax.activation:activation:1.1.1'
}

def allureResultsDir = "build/allure-results"
def archiveDir = "build/allure-results-archive/" + new Date().format('yyyy-MM-dd_HH-mm-ss')

task archiveAllureResults {
    doLast {
        def sourceDir = file("$buildDir/allure-results")
        if (sourceDir.exists()) {
            def targetDir = file(archiveDir)
            targetDir.mkdirs()
            copy {
                from sourceDir
                into targetDir
            }
            println "Allure results archived to: ${targetDir.absolutePath}"
        } else {
            println "Source directory $sourceDir does not exist, nothing to archive"
        }
    }
}

tasks.withType(Test) {
    useJUnitPlatform()

    systemProperty "file.encoding", "utf-8"
    systemProperty "console.encoding", "utf-8"

    systemProperties.putAll(System.getProperties())

    systemProperties.putAll([
            'selenide.browser': System.getProperty('browser', 'chrome'),
            'selenide.browserSize': System.getProperty('screen.size', '1920x1080'),
            'selenide.headless': System.getProperty('selenide.headless', 'false'),
            'selenide.remote': System.getProperty('selenide.remote', 'http://localhost:4444/wd/hub'),
            'webdriver.http.factory': System.getProperty('webdriver.http.factory', 'jdk-http-client'),
            'allure.results.directory': allureResultsDir,
            'allure.report.directory': "$buildDir/reports/allure-report"
    ])

    testLogging {
        lifecycle {
            events "passed", "skipped", "failed", "standard_error", "standard_out"
        }
    }

    finalizedBy archiveAllureResults
}

task simple_test(type: Test) {
    useJUnitPlatform {
        includeTags 'SEARCH'
    }
}

task allure_test(type: Test) {
    useJUnitPlatform {
        includeTags 'ALLURE'
    }
}

task ui_tests(type: Test) {
    useJUnitPlatform {
        includeTags 'UI'
    }
}

task api_tests(type: Test) {
    useJUnitPlatform {
        includeTags 'API'
    }
}

task smoke_tests(type: Test) {
    useJUnitPlatform {
        includeTags 'SMOKE', 'REGRESSION'
    }
}

// ========== Allure Report Tasks (исправлено для macOS) ==========

tasks.register('serveAllure', Exec) {
    description = 'Serve Allure report (opens in browser)'
    group = 'Reporting'

    doFirst {
        println "Allure results directory: $buildDir/allure-results"
        println "Starting Allure server..."
    }

    commandLine 'sh', '-c', "allure serve $buildDir/allure-results"
}

tasks.register('allureGenerate', Exec) {
    description = 'Generate Allure report'
    group = 'Reporting'

    commandLine 'sh', '-c', "allure generate $buildDir/allure-results -o $buildDir/reports/allure-report --clean"
}

tasks.register('openReport') {
    description = 'Open Allure report in browser'
    group = 'Reporting'

    doLast {
        def reportFile = file("$buildDir/reports/allure-report/index.html")
        if (reportFile.exists()) {
            java.awt.Desktop.desktop.browse reportFile.toURI()
            println "Report opened: $reportFile"
        } else {
            println "Report not found at: $reportFile"
            println "Run './gradlew allureGenerate' first or run tests to generate results"
        }
    }
}

tasks.register('testAndOpenReport') {
    dependsOn test, openReport
    description = 'Run tests and open Allure report'
    group = 'Verification'
}

task cleanAllureResults(type: Delete) {
    delete "$buildDir/allure-results"
    delete "$buildDir/reports/allure-report"
    delete "$buildDir/allure-results-archive"
    description = "Cleans allure-results, allure-report and archives"
}

clean {
    dependsOn cleanAllureResults
}