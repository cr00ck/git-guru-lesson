plugins {
    id 'java'
    id 'io.qameta.allure' version "2.11.2"
}

group = 'org.example'
version = '1.0-SNAPSHOT'

allure {
    version = "2.24.0"

    adapter {
        autoconfigure.set(true)

        frameworks {
            junit5 {
                adapterVersion.set("2.24.0")
                enabled.set(true)
                autoconfigureListeners.set(true)
            }
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'io.qameta.allure:allure-junit5:2.24.0'
    testImplementation 'io.qameta.allure:allure-selenide:2.24.0'

    testImplementation 'io.github.bonigarcia:webdrivermanager:5.6.3'
    testImplementation 'net.datafaker:datafaker:2.5.2'
    testImplementation 'com.codeborne:selenide:7.0.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'org.slf4j:slf4j-simple:2.0.9'
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.39.0'
    testImplementation 'commons-io:commons-io:2.21.0'
    testImplementation 'com.codeborne:pdf-test:1.8.1'
    testImplementation 'com.codeborne:xls-test:1.4.3'
    testImplementation 'com.opencsv:opencsv:5.12.0'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.10.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'net.javacrumbs.json-unit:json-unit-assertj:3.2.2'

}

tasks.withType(Test) {
    useJUnitPlatform()

    systemProperties = [
            'selenide.browser': 'chrome',
            'selenide.headless': 'true',  // ← ВАЖНО: true для Jenkins!
            //'selenide.headless': 'false',
            'allure.results.directory': "$buildDir/allure-results",
            'allure.report.directory': "$buildDir/reports/allure-report"
    ]
    jvmArgs = [
            '-Dwebdriver.chrome.driver=/usr/bin/chromedriver', // если нужно
            '-Dselenide.headless=true'
    ]

    testLogging {
        lifecycle {
            events "passed", "skipped", "failed", "standard_error", "standard_out"
            //exeptionFormat "short"
        }
    }
}
// типы тасков по тэгам
task simple_test(type: Test) {
    useJUnitPlatform{
        includeTags("SEARCH")
    }
}
task ui_tests(type: Test) {
    useJUnitPlatform {
        includeTags("UI")
    }
}

task api_tests(type: Test) {
    useJUnitPlatform {
        includeTags("API")
    }
}

task smoke_tests(type: Test) {
    useJUnitPlatform {
        includeTags("SMOKE", "REGRESSION")  // Два тега
    }
}
