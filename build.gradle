 plugins {
id 'java-library'
id 'io.qameta.allure' version "2.11.2"
}

group = 'org.example'
version = '1.0-SNAPSHOT'

allure {
    version = "2.24.0"

    adapter {
        autoconfigure.set(true)

        frameworks {
            junit5 {
                adapterVersion.set("2.24.0")
                enabled.set(true)
                autoconfigureListeners.set(true)
            }
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

def aspectjWeaverVersion = "1.9.22",
    selenideVersion = "6.13.0",
    restAssuredVersion = "5.3.0",
    allureVersion = "2.21.0",
    junitVersion = "5.9.3",
    slf4jVersion = "2.0.7"

dependencies {
    testImplementation "io.qameta.allure:allure-junit5:${allureVersion}"
    testImplementation "io.qameta.allure:allure-selenide:${allureVersion}"

    testImplementation 'io.github.bonigarcia:webdrivermanager:5.6.3'
    testImplementation 'net.datafaker:datafaker:2.5.2'
    // 6.x регистрирует SelenideNettyClientFactory (SPI) → ломается с Selenium 4.14+ без Netty; 7.x переключился на JdkHttpClient (см. META-INF в selenide-core).
    testImplementation 'com.codeborne:selenide:7.15.1'
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.slf4j:slf4j-simple:${slf4jVersion}"
    // Selenide pulls a compatible Selenium version; pinning selenium-java to 4.39 broke RemoteWebDriver (missing Netty HTTP client on classpath — see NettyClient$Factory).
    testImplementation 'commons-io:commons-io:2.21.0'
    testImplementation 'com.codeborne:pdf-test:1.8.1'
    testImplementation 'com.codeborne:xls-test:1.4.3'
    testImplementation 'com.opencsv:opencsv:5.12.0'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.10.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'net.javacrumbs.json-unit:json-unit-assertj:3.2.2'
    testImplementation 'io.appium:java-client:10.0.0'
    testImplementation 'org.aeonbits.owner:owner:1.0.12'


    // Правильная конфигурация Lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'


    // Обновленная версия REST Assured (совместима с Java 17)
    testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"
    testImplementation "io.rest-assured:json-path:${restAssuredVersion}"
    testImplementation "io.rest-assured:xml-path:${restAssuredVersion}"
    testImplementation "io.rest-assured:json-schema-validator:${restAssuredVersion}"
    testImplementation "io.qameta.allure:allure-rest-assured:${allureVersion}"


    // JAXB зависимости для Java 17
    testImplementation 'javax.xml.bind:jaxb-api:2.3.1'
    testImplementation 'com.sun.xml.bind:jaxb-impl:2.3.3'
    testImplementation 'com.sun.xml.bind:jaxb-core:2.3.0.1'
    testImplementation 'javax.activation:activation:1.1.1'
}
// создает уникальную папку для каждого запуска allure
// В build.gradle оставьте фиксированный путь для Jenkins
def allureResultsDir = "build/allure-results" // фиксированный путь для Jenkins
def archiveDir = "build/allure-results-archive/" + new Date().format('yyyy-MM-dd_HH-mm-ss')


// ⚠️ ВАЖНО: Определяем задачу archiveAllureResults ДО ее использования
task archiveAllureResults {
    doLast {
        def sourceDir = file("$buildDir/allure-results")
        if (sourceDir.exists()) {
            def targetDir = file(archiveDir)
            // Создаем директорию назначения
            targetDir.mkdirs()
            // Копируем файлы
            copy {
                from sourceDir
                into targetDir
            }
            println "Allure results archived to: ${targetDir.absolutePath}"
        } else {
            println "Source directory $sourceDir does not exist, nothing to archive"
        }
    }
}

tasks.withType(Test) { // чтобы запускался junit 5 , а так по дефолту 4
    useJUnitPlatform()

    // Настройки кодировки - добавьте их здесь
    systemProperty "file.encoding", "utf-8"
    systemProperty "console.encoding", "utf-8"

    systemProperties.putAll(System.getProperties()) // дает нам менять значение переменных. В консоле: ./gradlew allure_test -Dbrowser=opera

    systemProperties.putAll([
                    'selenide.browser': System.getProperty('browser', 'chrome'), // берем из -D или chrome по умолчанию
                    'selenide.browserSize': System.getProperty('screen.size', '1920x1080'), // берем из -D или 1920x1080 по умолчанию            'selenide.headless': 'true',  // ← ВАЖНО: true для Jenkins!
                    'selenide.headless': System.getProperty('headless', 'true'), // для Jenkins по умолчанию true
                    // Selenium 4.14+: avoid Netty HttpClient SPI (missing NettyClient$Factory when mixing Selenide + Appium dependency graphs)
                    'webdriver.http.factory': System.getProperty('webdriver.http.factory', 'jdk-http-client'),
                    'selenoid': System.getProperty('selenoid', 'selenoid.autotests.cloud'),
                    'allure.results.directory': allureResultsDir, // создает уникальную папку для каждого запуска allure
            'allure.report.directory': "$buildDir/reports/allure-report"
    ])


    testLogging {
        lifecycle {
            events "passed", "skipped", "failed", "standard_error", "standard_out"
            //exeptionFormat "short"
        }
    }
    // ✅ После тестов архивируем результаты
    finalizedBy archiveAllureResults
}
// типы тасков по тэгам
task simple_test(type: Test) {
    useJUnitPlatform {
        includeTags("SEARCH")
    }
}
    task allure_test(type: Test) { // TextBoxStepsAllureTest
        useJUnitPlatform {
            includeTags("ALLURE")
        }
    }
    task ui_tests(type: Test) {
        useJUnitPlatform {
            includeTags("UI")
        }
    }

    task api_tests(type: Test) {
        useJUnitPlatform {
            includeTags("API")
        }
    }

    task smoke_tests(type: Test) {
        useJUnitPlatform {
            includeTags("SMOKE", "REGRESSION")  // Два тега
        }
    }
