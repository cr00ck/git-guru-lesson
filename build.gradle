// ✅ ИСПРАВЛЕННЫЕ ЗАДАЧИ:
// Задачи для Allure отчета
tasks.register('serveAllure', Exec) {
    dependsOn test
    description = 'Serve Allure report'
    group = 'Reporting'

    doFirst {
        println "Allure results directory: $buildDir/allure-results"
        println "Note: Allure CLI must be installed on your system!"
        println "Install with: scoop install allure"
    }

    commandLine 'cmd', '/c', 'allure', 'serve', "$buildDir/allure-results"
}

tasks.register('allureGenerate', Exec) {
    dependsOn test
    description = 'Generate Allure report'
    group = 'Reporting'

    commandLine 'cmd', '/c', 'allure', 'generate',
            "$buildDir/allure-results",
            '-o', "$buildDir/reports/allure-report",
            '--clean'
}

tasks.register('openReport') {
    dependsOn allureGenerate
    description = 'Open Allure report in browser'
    group = 'Reporting'

    doLast {
        def reportFile = file("$buildDir/reports/allure-report/index.html")
        if (reportFile.exists()) {
            java.awt.Desktop.desktop.browse reportFile.toURI()
            println "Report opened: $reportFile"
        } else {
            println "Report not found at: $reportFile"
            println "Run './gradlew test allureGenerate' first"
        }
    }
}

tasks.register('testAndOpenReport') {
    dependsOn test, openReport
    description = 'Run tests and open Allure report'
    group = 'Verification'
}

task cleanAllureResults(type: Delete) { // очистка папки с результатами ./gradlew cleanAllureResults
    delete "$buildDir/allure-results"
    delete "$buildDir/reports/allure-report"
    delete "$buildDir/allure-results-archive"
    description = "Очищает папки allure-results, allure-report и архивы"
}

clean {
    dependsOn cleanAllureResults
}
