plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_19
    targetCompatibility = JavaVersion.VERSION_19
}

repositories {
    mavenCentral()
}

dependencies {
    // Стабильная версия Selenide с хорошей поддержкой JDK 21
//    testImplementation 'com.codeborne:selenide:7.3.2'
//    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
//    testImplementation 'org.slf4j:slf4j-simple:2.0.9'
    testImplementation 'net.datafaker:datafaker:2.5.2'
    // Используйте Selenide 7.0.4 (стабильная версия)
    testImplementation 'com.codeborne:selenide:7.0.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.6.4'
    testImplementation 'org.slf4j:slf4j-simple:2.0.9'
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.39.0'

    // Добавьте для совместимости с Chrome 143
   // testImplementation 'org.seleniumhq.selenium:selenium-devtools-v143:4.21.0'
}

test {
    useJUnitPlatform()
    systemProperties = [
            'selenide.browser': 'chrome',
            'selenide.headless': 'false',
            //'selenide.remote': 'http://localhost:4444/wd/hub' // если используете Selenium Grid
    ]
}