services:
  # ─── Standalone Chrome (тесты) ─────────────────────
  selenium-chromium:
    image: selenium/standalone-chromium:latest
    container_name: selenium-chromium
    ports:
      - "4444:4444"
      - "7900:7900"
    environment:
      - SE_VNC_PASSWORD=secret
    restart: unless-stopped
    networks:
      - selenoid_net

  # ─── Jenkins (CI/CD) ───────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-git-guru
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - selenoid_net

  # ─── Selenoid (браузерная ферма) ───────────────────
  selenoid:
    image: aerokube/selenoid:latest
    container_name: selenoid
    environment:
      - DOCKER_API_VERSION=1.40                    # ← ДОБАВИТЬ ЭТУ СТРОКУ
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./selenoid/config:/etc/selenoid:ro
      - ./selenoid/video:/opt/selenoid/video
      - ./selenoid/logs:/opt/selenoid/logs
    command:
      [
        "-conf", "/etc/selenoid/browsers.json",
        "-video-output-dir", "/opt/selenoid/video",
        "-log-output-dir", "/opt/selenoid/logs",
        "-limit", "5",
        "-session-attempt-timeout", "2m",
        "-service-startup-timeout", "2m",
        "-timeout", "10m"
      ]
    restart: unless-stopped
    networks:
      - selenoid_net

  selenoid-ui:
    image: aerokube/selenoid-ui:latest
    container_name: selenoid-ui
    ports:
      - "8081:8080"
    command: ["--selenoid-uri", "http://selenoid:4444"]
    depends_on:
      - selenoid
    restart: unless-stopped
    networks:
      - selenoid_net

  video-recorder:
    image: selenoid/video-recorder:latest-release
    container_name: video-recorder
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./selenoid/video:/opt/selenoid/video
    environment:
      - OVERRIDE_VIDEO_OUTPUT_DIR=/opt/selenoid/video
    restart: unless-stopped
    networks:
      - selenoid_net

volumes:
  jenkins_home:

networks:
  selenoid_net:
    driver: bridge